<div class="profile-page">

    <h2>My Profile</h2>

    <div class="profile-card">

        <div class="left">

            <div class="avatar">
                {{ user.firstName.charAt(0) }}{{ user.lastName.charAt(0) }}
            </div>

            <h3>{{ user.firstName }} {{ user.lastName }}</h3>

            <span class="badge">
                {{ user.role }}
            </span>

        </div>

        <div class="right">

            <div class="form-group">
                <label>First Name</label>
                <div *ngIf="!isEditingProfile" class="readonly-text">{{ user.firstName }}</div>
                <input *ngIf="isEditingProfile" type="text" [(ngModel)]="user.firstName">
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <div *ngIf="!isEditingProfile" class="readonly-text">{{ user.lastName }}</div>
                <input *ngIf="isEditingProfile" type="text" [(ngModel)]="user.lastName">
            </div>

            <div class="form-group">
                <label>Email</label>
                <div *ngIf="!isEditingProfile" class="readonly-text">{{ user.email }}</div>
                <input *ngIf="isEditingProfile" type="email" [(ngModel)]="user.email">
            </div>

            <div class="form-group">
                <label>Phone</label>
                <div *ngIf="!isEditingProfile" class="readonly-text">{{ user.phone }}</div>
                <input *ngIf="isEditingProfile" type="text" [(ngModel)]="user.phone">
            </div>

            <div class="form-group">
                <label>Function</label>
                <div *ngIf="!isEditingProfile" class="readonly-text">{{ user.fonction }}</div>
                <input *ngIf="isEditingProfile" type="text" [(ngModel)]="user.fonction">
            </div>

            <div class="button-group" *ngIf="!isEditingProfile">
                <button class="btn-cancel" (click)="cancel()">Cancel</button>
                <button class="btn-update" (click)="enableEdit()">Update</button>
            </div>

            <div class="button-group" *ngIf="isEditingProfile">
                <button class="btn-cancel" (click)="cancelEdit()">Cancel</button>
                <button class="btn-save" (click)="updateProfile()">Save</button>
            </div>

        </div>

    </div>

</div>
