<div class="page">

  <h2 class="page-title">My Activities</h2>

  <!-- =========================
        NEW ACTIVITY FORM
  ========================== -->

  <div class="card">

    <h3>Add New Activity</h3>

    <div class="grid">

      <div class="form-group">
        <label>Client</label>

        <div class="client-search">

          <input
            type="text"
            placeholder="Search client..."
            [(ngModel)]="clientSearch"
            (ngModelChange)="selectedClient = null">

          <div class="client-list" *ngIf="clientSearch && !selectedClient">

            <div
              class="client-item"
              *ngFor="let client of filteredClients()"
              (click)="selectClient(client)">

              <strong>{{client.nomContact}}</strong>
              <small>{{client.societe}}</small>

            </div>

            <div *ngIf="filteredClients().length === 0" class="inline-form-container">
              <p class="inline-form-title">Client not found. Add immediately:</p>
              
              <div class="inline-form-grid">
                <input type="text" placeholder="First Name" [(ngModel)]="newClient.firstName" class="inline-form-input">
                <input type="text" placeholder="Last Name" [(ngModel)]="newClient.lastName" class="inline-form-input">
              </div>
              
              <div class="inline-form-row">
                <input type="text" placeholder="Company" [(ngModel)]="newClient.company" class="inline-form-input">
              </div>

              <div class="inline-form-grid">
                <input type="text" placeholder="City" [(ngModel)]="newClient.city" class="inline-form-input">
                <input type="text" placeholder="Phone" [(ngModel)]="newClient.phone" class="inline-form-input">
              </div>

              <div class="inline-form-row">
                <input type="email" placeholder="Email" [(ngModel)]="newClient.email" 
                       [ngStyle]="{'border-color': (newClient.email && !isEmailValid) ? '#ef4444' : ''}"
                       class="inline-form-input">
                <small *ngIf="newClient.email && !isEmailValid" class="error-text">Please enter a valid email address.</small>
              </div>

              <div class="inline-form-actions">
                <select [(ngModel)]="newClient.status" class="inline-form-select inline-form-select-flex">
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
                <button (click)="saveClient()" [disabled]="newClient.email && !isEmailValid" class="inline-form-btn">
                  Save & Select
                </button>
              </div>
            </div>

          </div>

        </div>

      </div>


      <div class="form-group">

        <label>Activity</label>

        <select [(ngModel)]="activity.type">

          <option value="">Select</option>

          <option>Visite</option>

          <option>Appel</option>

          <option>Email</option>

        </select>

      </div>


      <div class="form-group">

        <label>Status</label>

        <select [(ngModel)]="activity.statut">

          <option value="">Select</option>

          <option>En cours</option>

          <option>Terminée</option>

          <option>Annulée</option>

        </select>

      </div>


      <div class="form-group">

        <label>Date</label>

        <input
          type="date"
          [(ngModel)]="activity.date">

      </div>

    </div>


    <div class="form-group">

      <label>Description</label>

      <textarea
        rows="4"
        [(ngModel)]="activity.description">

      </textarea>

    </div>

    <button class="primary-btn btn-success">
      Save Activity
    </button>

  </div>


  <!-- =========================
      SEARCH BAR
  ========================== -->

  <div class="toolbar">

    <input
      type="text"
      placeholder="Search by company..."
      [(ngModel)]="search">

    <input
      type="date"
      [(ngModel)]="dateFilter">

    <button class="primary-btn" (click)="searchActivities()">
      Search
    </button>

  </div>


  <!-- =========================
        TABLE
  ========================== -->

  <div class="card">

    <table>

      <thead>

      <tr>

        <th>Date</th>

        <th>Client</th>

        <th>Company</th>

        <th>Activity</th>

        <th>Status</th>

        <th>Actions</th>

      </tr>

      </thead>

      <tbody>

      <tr *ngFor="let a of filteredActivities">

        <td>{{a.date}}</td>

        <td>{{a.client}}</td>

        <td>{{a.societe}}</td>

        <td>{{a.type}}</td>

        <td>

          <span class="status">

            {{a.statut}}

          </span>

        </td>

        <td>

          <button class="icon-btn">✏️</button>

          <button class="icon-btn">🗑️</button>

        </td>

      </tr>

      </tbody>

    </table>

    <div class="pagination">

      <button>Previous</button>

      <span>1</span>

      <button>Next</button>

    </div>

  </div>

</div>
